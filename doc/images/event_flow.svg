<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
<rect x="120" y="22" width="120" height="34" rx="4" fill="#eef0f3" stroke="#99a3b3" stroke-width="1.2"/>
<text x="180.0" y="44" font-size="16" fill="#1c2941" text-anchor="middle">keyboard</text>
<rect x="260" y="22" width="120" height="34" rx="4" fill="#eef0f3" stroke="#99a3b3" stroke-width="1.2"/>
<text x="320.0" y="44" font-size="16" fill="#1c2941" text-anchor="middle">mouse</text>
<rect x="400" y="22" width="120" height="34" rx="4" fill="#eef0f3" stroke="#99a3b3" stroke-width="1.2"/>
<text x="460.0" y="44" font-size="16" fill="#1c2941" text-anchor="middle">joystick</text>
<rect x="540" y="22" width="120" height="34" rx="4" fill="#eef0f3" stroke="#99a3b3" stroke-width="1.2"/>
<text x="600.0" y="44" font-size="16" fill="#1c2941" text-anchor="middle">timers</text>
<rect x="680" y="22" width="130" height="34" rx="4" fill="#eef0f3" stroke="#99a3b3" stroke-width="1.2"/>
<text x="745.0" y="44" font-size="16" fill="#1c2941" text-anchor="middle">window system</text>
<line x1="180" y1="56" x2="400" y2="96" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="400.0,96.0 390.3,98.8 392.0,90.0" fill="#4a6699"/>
<line x1="320" y1="56" x2="440" y2="96" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="440.0,96.0 430.0,97.4 432.9,88.9" fill="#4a6699"/>
<line x1="460" y1="56" x2="480" y2="96" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="480.0,96.0 472.0,90.0 480.0,85.9" fill="#4a6699"/>
<line x1="600" y1="56" x2="520" y2="96" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="520.0,96.0 526.0,88.0 530.1,96.0" fill="#4a6699"/>
<line x1="745" y1="56" x2="560" y2="96" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="560.0,96.0 567.8,89.7 569.7,98.5" fill="#4a6699"/>
<rect x="330" y="98" width="300" height="38" rx="4" fill="#dfe7f5" stroke="#4a6699" stroke-width="1.4"/>
<text x="480" y="122" font-size="16" fill="#1c2941" text-anchor="middle" font-weight="bold">the event queue</text>
<line x1="480" y1="136" x2="480" y2="168" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="480.0,168.0 475.5,159.0 484.5,159.0" fill="#4a6699"/>
<rect x="250" y="170" width="460" height="84" rx="4" fill="#dfe7f5" stroke="#4a6699" stroke-width="1.4"/>
<text x="480" y="190" font-size="16" fill="#1c2941" text-anchor="middle" font-weight="bold">eventsover(): the master handler</text>
<rect x="268" y="204" width="130" height="30" rx="3" fill="#ffffff" stroke="#879ecb" stroke-width="1.2"/>
<text x="333" y="224" font-size="13" fill="#253555" text-anchor="middle">newest handler</text>
<rect x="415" y="204" width="130" height="30" rx="3" fill="#ffffff" stroke="#879ecb" stroke-width="1.2"/>
<text x="480" y="224" font-size="13" fill="#253555" text-anchor="middle">the one it replaced</text>
<rect x="562" y="204" width="130" height="30" rx="3" fill="#ffffff" stroke="#879ecb" stroke-width="1.2"/>
<text x="627" y="224" font-size="13" fill="#253555" text-anchor="middle">the default</text>
<line x1="398" y1="219" x2="413" y2="219" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="413.0,219.0 404.0,223.5 404.0,214.5" fill="#4a6699"/>
<line x1="545" y1="219" x2="560" y2="219" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="560.0,219.0 551.0,223.5 551.0,214.5" fill="#4a6699"/>
<text x="480" y="248" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">every event passes here; the widgets, managerc and the C++ wrapper hook this chain</text>
<line x1="480" y1="254" x2="480" y2="300" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="480.0,300.0 475.5,291.0 484.5,291.0" fill="#4a6699"/>
<text x="520" y="283" font-size="12.5" fill="#5a6478" text-anchor="start" font-style="italic">not handled</text>
<rect x="250" y="302" width="460" height="84" rx="4" fill="#dfe7f5" stroke="#4a6699" stroke-width="1.4"/>
<text x="480" y="322" font-size="16" fill="#1c2941" text-anchor="middle" font-weight="bold">eventover(e): the handler for this one event</text>
<rect x="268" y="336" width="130" height="30" rx="3" fill="#ffffff" stroke="#879ecb" stroke-width="1.2"/>
<text x="333" y="356" font-size="13" fill="#253555" text-anchor="middle">newest handler</text>
<rect x="415" y="336" width="130" height="30" rx="3" fill="#ffffff" stroke="#879ecb" stroke-width="1.2"/>
<text x="480" y="356" font-size="13" fill="#253555" text-anchor="middle">the one it replaced</text>
<rect x="562" y="336" width="130" height="30" rx="3" fill="#ffffff" stroke="#879ecb" stroke-width="1.2"/>
<text x="627" y="356" font-size="13" fill="#253555" text-anchor="middle">the default</text>
<line x1="398" y1="351" x2="413" y2="351" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="413.0,351.0 404.0,355.5 404.0,346.5" fill="#4a6699"/>
<line x1="545" y1="351" x2="560" y2="351" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="560.0,351.0 551.0,355.5 551.0,346.5" fill="#4a6699"/>
<text x="480" y="380" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">one chain for each kind of event; only the chain for this kind runs</text>
<line x1="480" y1="386" x2="480" y2="446" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="480.0,446.0 475.5,437.0 484.5,437.0" fill="#4a6699"/>
<text x="520" y="425" font-size="12.5" fill="#5a6478" text-anchor="start" font-style="italic">not handled</text>
<rect x="250" y="448" width="460" height="60" rx="4" fill="#fdf3d8" stroke="#b39237" stroke-width="1.4"/>
<text x="480" y="472" font-size="16" fill="#1c2941" text-anchor="middle" font-weight="bold">the program</text>
<text x="480" y="492" font-size="13" fill="#253555" text-anchor="middle">event(f, &amp;er) returns, with the event in er</text>
<line x1="710" y1="478" x2="790" y2="478" stroke="#4a6699" stroke-width="1.6"/>
<line x1="790" y1="478" x2="790" y2="117" stroke="#4a6699" stroke-width="1.6"/>
<line x1="790" y1="117" x2="632" y2="117" stroke="#4a6699" stroke-width="1.6"/>
<polygon points="632.0,117.0 641.0,112.5 641.0,121.5" fill="#4a6699"/>
<text x="860" y="290" font-size="16" fill="#1c2941" text-anchor="middle">event(f, &amp;er)</text>
<text x="860" y="308" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">the program's call</text>
<text x="860" y="324" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">takes the next event</text>
<text x="860" y="340" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">from the queue</text>
<line x1="250" y1="344" x2="170" y2="344" stroke="#b39237" stroke-width="1.6"/>
<line x1="170" y1="344" x2="170" y2="117" stroke="#b39237" stroke-width="1.6"/>
<line x1="170" y1="117" x2="328" y2="117" stroke="#b39237" stroke-width="1.6"/>
<polygon points="328.0,117.0 319.0,121.5 319.0,112.5" fill="#b39237"/>
<line x1="250" y1="212" x2="170" y2="212" stroke="#b39237" stroke-width="1.6"/>
<text x="90" y="220" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">handled:</text>
<text x="90" y="236" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">the event is consumed,</text>
<text x="90" y="252" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">event() goes on</text>
<text x="90" y="268" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">to the next one</text>
<text x="480" y="540" font-size="12.5" fill="#5a6478" text-anchor="middle" font-style="italic">Each handler may call the one it replaced; a chain that reaches its default marks the event not handled.</text>
</svg>
